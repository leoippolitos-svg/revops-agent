# Every external connection, live or simulated. See docs/standards/connectors.md.
# status: live | simulated | documented

connectors:
  - id: lakehouse
    system: DuckDB (local file)
    status: live
    access: read
    scopes: [gold schema only]
    auth: local file, opened read-only
    consumers: [agent, mcp_server, apps, automations]
    owner: RevOps

  - id: anthropic
    system: Claude API
    status: live
    access: read
    scopes: [messages]
    auth: ANTHROPIC_API_KEY in .env
    consumers: [agent, apps/agent-chat, automations/site-qualification, automations/prospecting-drafts, automations/proposal-generator, automations/ebr-narrative]
    owner: RevOps
    note: adapter in agent/model_client.py, tested against a fake API; never called with a real key; automations call it through automations/_lib/ai_step.py

  - id: crm
    system: CRM (HubSpot-like)
    status: simulated
    access: read
    scopes: [companies, contacts, deals, deal stage history]
    auth: private app token (documented only)
    consumers: [pipeline]
    owner: RevOps

  - id: billing
    system: Billing platform
    status: simulated
    access: read
    scopes: [subscriptions, invoices, payments]
    auth: API key (documented only)
    consumers: [pipeline]
    owner: Finance

  - id: google-workspace
    system: Google Sheets and Drive
    status: documented
    access: read-write
    scopes: [one shared folder for exported reports]
    auth: OAuth service account (documented only)
    consumers: [destinations]
    owner: RevOps
    note: write access limited to one folder; needs an ADR before going live

  - id: slack
    system: Slack
    status: simulated
    access: read-write
    scopes: ["post to #revops-alerts through an incoming webhook"]
    auth: incoming webhook URL in the SLACK_WEBHOOK_URL secret (never set here); kill switch SLACK_ALERTS_ENABLED
    consumers: [tools/catalog.py, automations/audits, observability/notify.py]
    owner: RevOps
    note: ADR-0020; messages are built by code and written to observability/logs/slack-<date>.md; the webhook host must be hooks.slack.com

  - id: github-actions
    system: GitHub Actions
    status: simulated
    access: read-write
    scopes: ["read workflow runs", "rerun a workflow whose card says rerun_ok", "open a pull request on an oncall/<id> branch"]
    auth: the GITHUB_TOKEN of each run, with the permissions written in each workflow file
    consumers: [tools/catalog.py, oncall/oncall.py, oncall/watchdog.py]
    owner: RevOps
    note: ADR-0021; reruns and pull requests need the kill switches ONCALL_ACTIONS_ENABLED and WATCHDOG_ENABLED; never enabled here

  - id: crm-owner-assignment
    system: CRM (HubSpot-like)
    status: documented
    access: read-write
    scopes: ["set the owner of a lead"]
    auth: private app token limited to that scope (documented only)
    consumers: [automations/lead-routing]
    owner: RevOps
    note: needs ADR-0010 and a new decision before going live; simulated by writing assignments to observability/logs

  - id: product-provisioning
    system: Product admin API
    status: documented
    access: read-write
    scopes: ["create one customer workspace and request the onboarding kickoff"]
    auth: service token limited to that scope (documented only)
    consumers: [automations/closed-won-provisioning]
    owner: Customer Success
    note: needs ADR-0011 and a new decision before going live; simulated by writing requests to observability/logs
