# Index of context documents. The agent reads this first and loads documents on demand.
# status: draft | canonical | deprecated | planned (no document yet)

concepts:
  - id: active-customer
    path: concepts/active-customer.md
    summary: Who counts as a paying customer at a point in time
    status: canonical
  - id: mrr
    path: concepts/mrr.md
    summary: Monthly recurring revenue and its movements (new and churned)
    status: canonical
  - id: funnel-stages
    path: concepts/funnel-stages.md
    summary: The stages a deal moves through, from qualification to closed won or lost
    status: canonical
  - id: mql
    path: concepts/mql.md
    summary: Marketing qualified lead, and how Marketing and Sales count it differently
    status: canonical
  - id: lead-routing
    path: concepts/lead-routing.md
    summary: Which owner receives a new marketing qualified lead, by segment and capacity
    status: canonical
  - id: closed-won-provisioning
    path: concepts/closed-won-provisioning.md
    summary: When a signed deal gets a workspace and onboarding kickoff, and what provisioning does not do
    status: canonical
  - id: cross-cutting-rules
    path: concepts/cross-cutting-rules.md
    summary: Currency, dates, internal accounts, data-quality flags and sources of truth that apply to every analysis
    status: canonical

