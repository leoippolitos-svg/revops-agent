version: 2

# Gold is the business grain the agent reads. These descriptions are the catalog:
# they say what each table and column IS. What a metric MEANS for the business
# (who counts, what is excluded) lives in the context documents under context/.
# All figures are as of the newest daily export loaded into bronze.

models:
  - name: mrr_monthly
    description: Monthly recurring revenue and its movements, one row per calendar month from the first subscription to the month of the newest data. The last row is a month still in progress.
    columns:
      - name: month
        description: Primary key. First day of the calendar month.
        data_tests: [unique, not_null]
      - name: starting_mrr_usd
        description: Recurring revenue in US dollars at the end of the previous month. Zero for the first month.
        data_tests: [not_null]
      - name: new_mrr_usd
        description: Monthly recurring revenue in US dollars of subscriptions that started during the month.
        data_tests: [not_null]
      - name: churned_mrr_usd
        description: Monthly recurring revenue in US dollars of subscriptions that ended during the month.
        data_tests: [not_null]
      - name: ending_mrr_usd
        description: Recurring revenue in US dollars of subscriptions in force on the last day of the month, or on the newest data day for the month in progress.
        data_tests: [not_null]

  - name: active_customer_monthly
    description: Number of active customers at the end of each calendar month, one row per month from the first subscription to the month of the newest data.
    columns:
      - name: month
        description: Primary key. First day of the calendar month.
        data_tests: [unique, not_null]
      - name: active_customers
        description: Number of distinct companies with at least one subscription in force and already paid at least once on the last day of the month, or on the newest data day for the month in progress.
        data_tests: [not_null]
      - name: active_subscriptions
        description: Number of subscriptions in force and already paid at least once on the same day. Always at least active_customers.
        data_tests: [not_null]

  - name: funnel_stage_monthly
    description: Number and value of deals that entered each stage of the sales funnel in each calendar month. A stage with no entries in a month has no row.
    columns:
      - name: month_stage_key
        description: Primary key. The month and the stage joined with a bar, for example 2026-01-01|discovery.
        data_tests: [unique, not_null]
      - name: month
        description: First day of the calendar month in which the deals entered the stage.
        data_tests: [not_null]
      - name: stage
        description: Funnel stage as stored by the CRM.
        data_tests:
          - accepted_values:
              arguments:
                values: [qualification, discovery, proposal, negotiation, closed_won, closed_lost]
      - name: stage_order
        description: Position of the stage in the funnel, 1 for qualification to 6 for closed_lost, for sorting.
        data_tests: [not_null]
      - name: deals_entered
        description: Number of distinct deals that entered the stage during the month, according to the stage dates recorded by the CRM.
        data_tests: [not_null]
      - name: amount_usd_entered
        description: Sum in US dollars of the yearly contract value of those deals.

  - name: funnel_conversion_monthly
    description: Funnel conversion by cohort, one row per calendar month in which deals entered qualification. Each row follows the deals of that cohort and counts how many ever reached each later stage, so recent cohorts are still maturing.
    columns:
      - name: cohort_month
        description: Primary key. First day of the calendar month in which the deals entered qualification.
        data_tests: [unique, not_null]
      - name: deals_qualified
        description: Number of deals that entered qualification during the month.
        data_tests: [not_null]
      - name: reached_discovery
        description: Number of those deals that have entered discovery, whenever it happened.
        data_tests: [not_null]
      - name: reached_proposal
        description: Number of those deals that have entered proposal.
        data_tests: [not_null]
      - name: reached_negotiation
        description: Number of those deals that have entered negotiation.
        data_tests: [not_null]
      - name: closed_won
        description: Number of those deals that have entered closed_won.
        data_tests: [not_null]
      - name: closed_lost
        description: Number of those deals that have entered closed_lost.
        data_tests: [not_null]
      - name: still_open
        description: Number of those deals that have neither closed_won nor closed_lost.
        data_tests: [not_null]

  - name: mql_monthly
    description: Marketing qualified leads counted the way Marketing counts them and the way Sales counts them, one row per calendar month in which a form was submitted.
    columns:
      - name: month
        description: Primary key. First day of the calendar month in which the forms were submitted.
        data_tests: [unique, not_null]
      - name: form_submissions
        description: Number of marketing forms submitted during the month.
        data_tests: [not_null]
      - name: marketing_mqls
        description: Number of those submissions that Marketing flagged as a marketing qualified lead.
        data_tests: [not_null]
      - name: sales_mqls
        description: Number of those submissions whose contact Sales flagged as a marketing qualified lead.
        data_tests: [not_null]
      - name: conflicting_flags
        description: Number of those submissions where the Marketing flag and the Sales flag disagree.
        data_tests: [not_null]

  - name: data_quality_snapshot
    description: One row with the number of records that carry each data-quality flag, as of the newest daily export. It exposes counts only; the flagged records themselves stay in silver.
    columns:
      - name: as_of
        description: Primary key. Date of the newest daily export loaded.
        data_tests: [unique, not_null]
      - name: companies
        description: Number of company records, duplicates included.
        data_tests: [not_null]
      - name: possible_duplicate_companies
        description: Number of company records whose name matches another record's name, ignoring letter case. Both records of a pair are counted.
        data_tests: [not_null]
      - name: deals
        description: Number of deals, whatever their stage.
        data_tests: [not_null]
      - name: deals_without_company
        description: Number of deals the CRM holds with no company attached.
        data_tests: [not_null]
      - name: subscriptions
        description: Number of subscriptions, whatever their status.
        data_tests: [not_null]
      - name: subscriptions_without_deal
        description: Number of subscriptions whose deal is not in the CRM.
        data_tests: [not_null]
      - name: closed_won_deals
        description: Number of deals in the closed_won stage.
        data_tests: [not_null]
      - name: closed_won_without_subscription
        description: Number of closed_won deals that no subscription points to. It includes deals won in the last two weeks, because a subscription starts within two weeks of the win.
        data_tests: [not_null]

  - name: funnel_time_in_stage_monthly
    description: How many days deals stayed in each open stage (qualification to negotiation), grouped by the calendar month they left it. A deal leaves a stage when it enters the next one, including closed_won and closed_lost. Deals still in a stage are not counted. A stage with no exits in a month has no row.
    columns:
      - name: month_stage_key
        description: Primary key. The month the deals left the stage and the stage joined with a bar, for example 2026-01-01|discovery.
        data_tests: [unique, not_null]
      - name: month
        description: First day of the calendar month in which the deals left the stage.
        data_tests: [not_null]
      - name: stage
        description: Open funnel stage the deals left.
        data_tests:
          - accepted_values:
              arguments:
                values: [qualification, discovery, proposal, negotiation]
      - name: stage_order
        description: Position of the stage in the funnel, 1 for qualification to 4 for negotiation, for sorting.
        data_tests: [not_null]
      - name: deals_left
        description: Number of deals that left the stage during the month, including those with out-of-order dates.
        data_tests: [not_null]
      - name: out_of_order_exits
        description: Number of those deals whose recorded exit date is earlier than their entry date. They are left out of the day figures.
        data_tests: [not_null]
      - name: median_days_in_stage
        description: Median number of days between entering and leaving the stage, for deals with consistent dates. Empty when every exit in the month is out of order.
      - name: avg_days_in_stage
        description: Average number of days between entering and leaving the stage, same deals as the median.

  - name: deal_subscription_reconciliation
    description: One row per closed won deal or subscription, matched on the deal id the subscription carries, with whether they matched and the monthly gap between the deal amount and the subscription MRR. The input of the reconciliation audit.
    columns:
      - name: deal_id
        description: Identifier of the deal, from the CRM or carried by the subscription.
        data_tests: [not_null]
      - name: subscription_id
        description: Identifier of the subscription in billing; empty when a won deal has none.
      - name: company_id
        description: Company of the deal, or of the subscription when the deal is missing.
      - name: owner_id
        description: Owner of the deal; empty when the deal is missing from the CRM.
      - name: closed_at
        description: Date the deal was closed won; empty when the deal is missing.
      - name: started_at
        description: Date the subscription started; empty when there is none.
      - name: deal_amount_usd
        description: Yearly contract value of the deal in US dollars.
      - name: subscription_mrr_usd
        description: Monthly recurring revenue of the subscription in US dollars.
      - name: match_status
        description: matched, won_without_subscription or subscription_without_deal.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [matched, won_without_subscription, subscription_without_deal]
      - name: monthly_gap_usd
        description: Deal amount divided by 12 minus the subscription MRR, for matched rows only; zero means they agree.
  - name: possible_duplicate_company
    description: Company records flagged as possible duplicates, one row each, with the shared name key and how many records carry it. A review list; nothing is merged.
    columns:
      - name: company_id
        description: Primary key. Identifier of the company record in the CRM.
        data_tests: [unique, not_null]
      - name: name
        description: Company name as stored.
        data_tests: [not_null]
      - name: name_key
        description: The name in lower case without spaces at the ends, which groups the possible duplicates.
        data_tests: [not_null]
      - name: records_with_name
        description: How many flagged records share this name key.
        data_tests: [not_null]
      - name: owner_id
        description: Owner of the company record.
      - name: created_at
        description: Date the company record was created.
  - name: onboarding_progress
    description: One row per subscription with the date of each onboarding milestone and the latest one reached. The input of the onboarding auto-advance.
    columns:
      - name: subscription_id
        description: Primary key. Identifier of the subscription in billing.
        data_tests: [unique, not_null]
      - name: company_id
        description: Company of the subscription.
      - name: kickoff_at
        description: Date the kickoff milestone was reached; empty if not yet.
      - name: configured_at
        description: Date the configured milestone was reached; empty if not yet.
      - name: go_live_at
        description: Date the go-live milestone was reached; empty if not yet.
      - name: current_milestone
        description: The latest milestone reached, or not_started.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [not_started, kickoff, configured, go_live]
  - name: subscription_lifecycle
    description: One row per subscription with its status, dates and how many other active subscriptions its company has. The input of the deactivation after churn.
    columns:
      - name: subscription_id
        description: Primary key. Identifier of the subscription in billing.
        data_tests: [unique, not_null]
      - name: company_id
        description: Company of the subscription.
      - name: status
        description: active or churned, from billing.
        data_tests: [not_null]
      - name: started_at
        description: Date the subscription started.
      - name: ended_at
        description: Date the subscription ended; empty while active.
      - name: other_active_subscriptions
        description: Number of other active subscriptions of the same company.
        data_tests: [not_null]
  - name: deal_amount
    description: One row per deal with its owner, stage and yearly amount. The input of the deal amount recalculation.
    columns:
      - name: deal_id
        description: Primary key. Identifier of the deal in the CRM.
        data_tests: [unique, not_null]
      - name: owner_id
        description: Owner of the deal.
      - name: stage
        description: Current stage of the deal.
        data_tests: [not_null]
      - name: amount_usd
        description: Yearly contract value of the deal in US dollars, as stored in the CRM.
  - name: owner_directory
    description: One row per owner with the full name and team, so answers can name people instead of showing ids. It holds no e-mail or other contact detail.
    columns:
      - name: owner_id
        description: Primary key. Identifier of the owner in the CRM.
        data_tests: [unique, not_null]
      - name: full_name
        description: The owner's full name as stored in the CRM, used to name people in answers.
        data_tests: [not_null]
      - name: team
        description: Team the owner belongs to, for example sdr, sales or enterprise.
        data_tests: [not_null]
  - name: owner_workload
    description: Open deals per owner as of the newest daily export, one row per owner, including owners with no open deal. It holds no names or contact details.
    columns:
      - name: owner_id
        description: Primary key. Identifier of the owner in the CRM.
        data_tests: [unique, not_null]
      - name: team
        description: Team the owner belongs to, as stored by the CRM, for example sdr, sales or enterprise.
        data_tests: [not_null]
      - name: open_deals
        description: Number of deals owned by this owner that are neither closed_won nor closed_lost.
        data_tests: [not_null]
      - name: open_amount_usd
        description: Sum in US dollars of the yearly contract value of those open deals. Zero when there are none.
        data_tests: [not_null]
