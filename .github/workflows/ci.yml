name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rule-zero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Block real company terms
        run: python tools/check_leaks.py
        env:
          LEAK_TERMS: ${{ secrets.LEAK_TERMS }}

  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Same pinned versions as local development (requirements.txt).
      - run: pip install -r requirements.txt
      - name: Check skills follow the standard
        run: python tools/check_skills.py
      - name: Check context documents and the catalog agree
        run: python tools/check_context.py
      - name: Check the rendered catalog is up to date
        run: python tools/build_catalog.py --check
      - name: Check the eval case files are well formed
        run: python tools/check_evals.py
      - name: Check the connector registry
        run: python tools/check_connectors.py
      - name: Check the context A/B design
        run: python tools/check_context_ab.py
      - name: Check the micro-app specs
        run: python tools/check_apps.py
      - name: Check the automation specs
        run: python tools/check_automations.py
      - name: Warn about stale derived copies
        run: python tools/check_derived.py

  # The README and this job use Python 3.12; local development may use a newer one.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest
