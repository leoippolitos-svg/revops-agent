name: AI security review

# The switch for this repository: it only calls the reusable pipeline, with no logic of its
# own (docs/standards/security-review-pipeline.md). Off until the repository variable
# AI_SECURITY_REVIEW_ENABLED is true and the ANTHROPIC_API_KEY secret exists.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  security:
    if: ${{ vars.AI_SECURITY_REVIEW_ENABLED == 'true' }}
    uses: ./.github/workflows/security-review-pipeline.yml
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
