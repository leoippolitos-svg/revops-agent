name: AI security review

# An AI review of each pull request diff against the security rules
# (docs/standards/security.md, docs/standards/verification.md). Off until the repository
# variable AI_SECURITY_REVIEW_ENABLED is true and the ANTHROPIC_API_KEY secret exists.
# Before switching it on, pin the action below to a full commit SHA: an action referenced
# by branch can change under you. Green here is not a security review by itself: read the
# findings, and read the post-merge result too.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write   # post findings as review comments

jobs:
  review:
    if: ${{ vars.AI_SECURITY_REVIEW_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: anthropics/claude-code-security-review@main
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          comment-pr: true
