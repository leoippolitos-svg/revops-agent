name: Weekly audit

# Rebuilds the fictional lakehouse and runs the data-quality audit
# (automations/audits/SPEC.md). The report is kept as a workflow artifact, which is
# this repository's simulated alert channel. Nothing is sent anywhere else.
on:
  schedule:
    - cron: "0 7 * * 1"   # Mondays, 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build the lakehouse
        run: python tools/setup.py
      - name: Run the audit
        run: python automations/audits/audit.py --db data/lakehouse.duckdb --write
        env:
          SLACK_ALERTS_ENABLED: ${{ vars.SLACK_ALERTS_ENABLED }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      - name: Reconcile won deals and subscriptions
        run: python automations/reconciliation/reconcile.py --db data/lakehouse.duckdb --write
        env:
          SLACK_ALERTS_ENABLED: ${{ vars.SLACK_ALERTS_ENABLED }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      - name: Queue possible duplicate companies
        run: python automations/duplicate-companies/duplicates.py --db data/lakehouse.duckdb --write
      - uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: |
            observability/logs/audit-*.md
            observability/logs/reconciliation-*.md
            observability/logs/duplicate-companies-*.md
            observability/logs/slack-*.md
          if-no-files-found: error
